name: Keep Supabase DB alive

on:
  schedule:
    # Rulează la fiecare 4 zile (Supabase suspendă după 7 zile fără activitate)
    - cron: "0 8 */4 * *"
  workflow_dispatch: # permite rulare manuală din GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase DB
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "406" ]; then
            echo "Ping failed with status $STATUS"
            exit 1
          fi
          echo "DB is alive."
